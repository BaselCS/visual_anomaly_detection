[project]
name = "visual-anomaly-detection"
version = "0.1.0"
description = "Visual anomaly detection using Stable Diffusion with LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "diffusers>=0.36.0",
    "ftfy>=6.3.1",
    "peft>=0.18.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.1.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]
